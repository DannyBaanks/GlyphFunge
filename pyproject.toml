[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "glyphfunge"
version = "0.3.0"
description = "Deterministic geometric frontend/compiler for Befunge-93"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.0.0"]

[project.scripts]
glyphfunge = "glyphfunge.cli:main"

[tool.setuptools.packages.find]
include = ["glyphfunge*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
